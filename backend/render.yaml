services:
  - type: web
    name: refill-loop-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DEMO_MODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
