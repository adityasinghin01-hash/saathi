<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Choose role — app</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="saathi.css">
<link rel="stylesheet" href="ds/saathi/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fbf4ea}
a{color:#8a3517}a:hover{color:#8f3a1b}
</style>
</helmet>
<div class="sa-root" data-audience="{{aud}}" style="width: 360px; height: 800px; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; position: relative">
<svg class="sa-sprite" aria-hidden="true"><defs>
<symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"></path></symbol>
<symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></symbol>
</defs></svg>
<div style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a class="sa-iconbtn" href="M-Language.dc.html" aria-label="पीछे · Back"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"></use></svg></a>
<div class="dots" aria-label="कदम 2 / 3 · Step 2 of 3"><i></i><i class="on"></i><i></i></div>
<div class="sa-lang sa-lang--sm" role="group" aria-label="भाषा · Language"><button type="button" aria-pressed="{{hiOn}}" onClick="{{setHi}}">हिं</button><button type="button" aria-pressed="{{enOn}}" onClick="{{setEn}}">EN</button></div>
</div>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="m-title hd" style="--bi-2nd: 16px"><span class="sa-bi"><span lang="hi">आप कौन हैं?</span><span lang="en">Who are you?</span></span></h1>
<p class="m-caption"><span class="sa-bi"><span lang="hi">डेमो देखने के लिए एक भूमिका चुनें</span><span lang="en">Pick a role to explore the demo</span></span></p>
</div>
<div role="radiogroup" aria-label="भूमिका · Role" style="display: flex; flex-direction: column; gap: 12px">
<button type="button" role="radio" aria-checked="{{r0}}" class="pick {{c0}}" onClick="{{p0}}" style="padding: 12px 16px 12px 12px">
<span class="pick-art g-sunk" style="width: 72px; height: 72px"><img src="/_blob/583792078e9f13de2bd11ff11486580f" alt=""></span>
<span style="flex-grow: 1; font: 600 18px/26px var(--font-sans); --bi-2nd: 14px"><span class="sa-bi"><span lang="hi">मरीज़</span><span lang="en">Patient</span></span></span>
<span class="pick-radio"><svg class="ic ic-16" aria-hidden="true" style="stroke-width: 3"><use href="#i-check"></use></svg></span>
</button>
<button type="button" role="radio" aria-checked="{{r1}}" class="pick {{c1}}" onClick="{{p1}}" style="padding: 12px 16px 12px 12px">
<span class="pick-art g-mari" style="width: 72px; height: 72px"><img src="/_blob/2d1741c84be3e18556864a5c66b5f945" alt=""></span>
<span style="flex-grow: 1; font: 600 18px/26px var(--font-sans); --bi-2nd: 14px"><span class="sa-bi"><span lang="hi">आशा दीदी</span><span lang="en">ASHA worker</span></span></span>
<span class="pick-radio"><svg class="ic ic-16" aria-hidden="true" style="stroke-width: 3"><use href="#i-check"></use></svg></span>
</button>
<button type="button" role="radio" aria-checked="{{r2}}" class="pick {{c2}}" onClick="{{p2}}" style="padding: 12px 16px 12px 12px">
<span class="pick-art g-leaf" style="width: 72px; height: 72px"><img src="/_blob/97632bfdcd20b386611835efbc1c4df4" alt=""></span>
<span style="flex-grow: 1; font: 600 18px/26px var(--font-sans); --bi-2nd: 14px"><span class="sa-bi"><span lang="hi">फ़ार्मासिस्ट</span><span lang="en">Pharmacist</span></span></span>
<span class="pick-radio"><svg class="ic ic-16" aria-hidden="true" style="stroke-width: 3"><use href="#i-check"></use></svg></span>
</button>
<button type="button" role="radio" aria-checked="{{r3}}" class="pick {{c3}}" onClick="{{p3}}" style="padding: 12px 16px 12px 12px">
<span class="pick-art g-clay" style="width: 72px; height: 72px"><img src="/_blob/a6525a3b924284bc4c89308e7bb333a3" alt=""></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; align-items: flex-start"><span style="font: 600 18px/26px var(--font-sans); --bi-2nd: 14px"><span class="sa-bi"><span lang="hi">ज़िला अधिकारी</span><span lang="en">District officer</span></span></span><span class="sa-age" style="min-height: 24px"><svg class="ic ic-16" aria-hidden="true"><use href="#i-map"></use></svg><span class="sa-bi sa-bi--inline"><span lang="hi">कंप्यूटर पर बेहतर</span><span lang="en">Best on web</span></span></span></span>
<span class="pick-radio"><svg class="ic ic-16" aria-hidden="true" style="stroke-width: 3"><use href="#i-check"></use></svg></span>
</button>
</div>
</main>
<div style="flex: none; padding: 16px 16px 24px">
<a class="sa-btn sa-btn--hero" href="{{next}}"><span class="sa-bi"><span lang="hi">आगे बढ़ें</span><span lang="en">Continue</span></span><svg class="ic ic-28" aria-hidden="true"><use href="#i-chevron-right"></use></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const lang = s.lang || 'hi';
    const role = s.role == null ? 0 : s.role;
    const v = { aud: lang === 'hi' ? 'field' : 'desk', hiOn: lang === 'hi', enOn: lang === 'en',
      setHi: () => this.setState({ lang: 'hi' }), setEn: () => this.setState({ lang: 'en' }),
      next: ['M-DemoUser.dc.html', 'M-Asha-Home.dc.html', 'M-Shell-Pharmacist.dc.html', 'W-DemoUser.dc.html'][role] };
    [0, 1, 2, 3].forEach((i) => {
      v['r' + i] = role === i;
      v['c' + i] = role === i ? 'is-on' : '';
      v['p' + i] = () => this.setState({ role: i });
    });
    return v;
  }
}
</script>
</body>
</html>
