<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signed out — web</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="saathi.css">
<link rel="stylesheet" href="ds/saathi/components/bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fbf4ea}
a{color:#8a3517}a:hover{color:#8f3a1b}
</style>
</helmet>
<div class="sa-root" data-audience="{{aud}}" style="width: 1440px; height: 900px; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; position: relative">
<svg class="sa-sprite" aria-hidden="true"><defs>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></symbol>
<symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M8 12.3l2.7 2.7L16 9.5"></path></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 11A7.5 7.5 0 0 0 6 7.2L4.5 9"></path><path d="M4.5 4.5V9H9"></path><path d="M4.5 13A7.5 7.5 0 0 0 18 16.8l1.5-1.8"></path><path d="M19.5 19.5V15H15"></path></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5h-6v5.5H5.5A1.5 1.5 0 0 1 4 19z"></path></symbol>
</defs></svg>
<header style="height: 80px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 80px">
<a href="Main.dc.html" aria-label="Saathi home · होम"><img src="/_blob/19cb50ae6b922b216d7885119cae8135" alt="साथी Saathi" style="height: 40px; width: auto; display: block"></a>
<div class="sa-lang sa-lang--sm" role="group" aria-label="Language · भाषा"><button type="button" aria-pressed="{{hiOn}}" onClick="{{setHi}}">हिं</button><button type="button" aria-pressed="{{enOn}}" onClick="{{setEn}}">EN</button></div>
</header>
<main style="flex-grow: 1; display: grid; place-items: center; padding-bottom: 80px">
<div class="sa-card sa-card--web bi-c" style="width: 560px; padding: 48px; gap: 20px; align-items: center; text-align: center; border-radius: var(--radius-xl)">
<div style="width: 200px; height: 200px; border-radius: 50%; background: var(--marigold-100); display: grid; place-items: center"><img src="/_blob/a6525a3b924284bc4c89308e7bb333a3" alt="" style="width: 184px; height: 184px; object-fit: contain"></div>
<h1 class="d-h1 hd" style="--bi-2nd: 18px"><span class="sa-bi"><span lang="hi">आप सुरक्षित रूप से बाहर हैं</span><span lang="en">You’re safely signed out</span></span></h1>
<p class="d-body muted" style="--bi-2nd: 14px"><span class="sa-bi"><span lang="hi">लॉग आउट करने या 30 मिनट तक कुछ न होने पर सत्र ख़त्म हो जाता है।</span><span lang="en">Sessions end when you log out, or after 30 quiet minutes.</span></span></p>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; text-align: left">
<div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-md); background: var(--status-ok-bg); color: var(--status-ok); font: 600 14px/20px var(--font-sans)"><svg class="ic ic-20" aria-hidden="true"><use href="#i-check-circle"></use></svg><span class="sa-bi"><span lang="en">All decisions saved</span><span lang="hi">सब फ़ैसले सेव</span></span></div>
<div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-md); background: var(--paper-sunk); font: 500 14px/20px var(--font-sans)"><svg class="ic ic-20" aria-hidden="true" style="color: var(--ink-muted)"><use href="#i-clock"></use></svg><span class="sa-bi"><span lang="en">Last active 4:12 pm</span><span lang="hi">आख़िरी बार 4:12 PM</span></span></div>
</div>
<div style="display: flex; gap: 12px; width: 100%">
<a class="sa-btn sa-btn--outline" href="Main.dc.html" style="flex: 1"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg><span class="sa-bi"><span lang="hi">होम पेज</span><span lang="en">Home page</span></span></a>
<a class="sa-btn" href="W-Welcome.dc.html" style="flex: 1"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg><span class="sa-bi"><span lang="hi">फिर से साइन इन</span><span lang="en">Sign in again</span></span></a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || 'en';
    return {
      aud: lang === 'hi' ? 'field' : 'desk',
      hiOn: lang === 'hi', enOn: lang === 'en',
      setHi: () => this.setState({ lang: 'hi' }),
      setEn: () => this.setState({ lang: 'en' })
    };
  }
}
</script>
</body>
</html>
