name: Keep Saathi API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          for attempt in 1 2 3 4; do
            curl -fsS --max-time 90 https://saathi-api-gm4i.onrender.com/api/v1/health && exit 0
            if [ "$attempt" -lt 4 ]; then sleep 5; fi
          done
          exit 1
